[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.6.0"
description = "Governed agent execution, deterministic evaluation, data gates, automation, value routing, and deployment capsules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "mypy>=1.10",
    "pytest>=9.1.1",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
sentinel = "sentinel.cli:main"
sentinel-eval = "sentinel.eval_cli:main"
sentinel-code-review = "sentinel.code_review_cli:main"
sentinel-import-otel = "sentinel.trace_cli:main"
sentinel-data-gate = "sentinel.data_gate_cli:main"
sentinel-automation = "sentinel.automation_cli:main"
sentinel-value-router = "sentinel.value_router_cli:main"
sentinel-capsule = "sentinel.capsule_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
