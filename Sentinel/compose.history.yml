services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: sentinel_history
      POSTGRES_USER: sentinel_owner
      POSTGRES_PASSWORD: ${SENTINEL_HISTORY_DEV_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - history_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_owner -d sentinel_history"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  history_data:
