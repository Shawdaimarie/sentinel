services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 2s
      timeout: 2s
      retries: 20
  gateway:
    build: .
    environment:
      DATABASE_URL: postgresql://sentinel:local-only@db:5432/sentinel
      SENTINEL_LOCAL_TOKENS: '{"demo-alice":"alice:tenant-a","demo-bob":"bob:tenant-b","demo-admin":"admin:tenant-a","demo-ratelimit":"rate-tester:tenant-b"}'
      CAPABILITY_SECRET: local-demo-secret-change-me
      CAPABILITY_TTL_SECONDS: ${SENTINEL_CAPABILITY_TTL_SECONDS:-300}
    ports: ["127.0.0.1:${SENTINEL_GATEWAY_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
  explorer:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports: ["127.0.0.1:${SENTINEL_EXPLORER_PORT:-5173}:8080"]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
