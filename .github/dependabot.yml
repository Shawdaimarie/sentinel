version: 2
updates:
  - package-ecosystem: pip
    directory: /Sentinel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Base images are pinned by digest; these keep the pins current so a
  # reproducible input never silently becomes an unpatched one.
  - package-ecosystem: docker
    directory: /Sentinel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /Aegis
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: /Sentinel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
