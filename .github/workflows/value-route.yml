name: Value Route Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/value-route.yml"
      - "Sentinel/src/sentinel/value_router.py"
      - "Sentinel/src/sentinel/value_router_cli.py"
      - "Sentinel/tests/test_value_router*.py"
      - "Sentinel/examples/value_route_items.json"
      - "Sentinel/docs/VALUE_ROUTE_GATEWAY.md"
      - "Sentinel/docs/OWNERSHIP_AND_PUBLIC_PROOF_BOUNDARY.md"
      - "Sentinel/pyproject.toml"

permissions:
  contents: read

jobs:
  route-value:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: Sentinel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Sentinel/pyproject.toml
      - name: Install Sentinel
        run: |
          python -m pip install --upgrade pip "setuptools>=83" wheel
          python -m pip install -e ".[dev]"
      - name: Route deployable value
        run: |
          sentinel-value-router \
            --items examples/value_route_items.json \
            --json-out reports/value-route/value_routes.json \
            --markdown-out reports/value-route/value_routes.md \
            --min-score 0.70
      - name: Upload value route evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinel-value-route-gateway
          path: Sentinel/reports/value-route/
