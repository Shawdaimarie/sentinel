name: Apply trace importer CI corrections

on:
  push:
    branches: [feat/otel-trace-import]
    paths:
      - .github/workflows/fix-trace-import.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/otel-trace-import
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact corrections
        run: python .github/fix_trace_import.py
      - name: Commit source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sentinel/src/sentinel/trace_import.py
          git commit -m "fix: satisfy trace importer lint and strict typing"
          git push origin HEAD:feat/otel-trace-import
