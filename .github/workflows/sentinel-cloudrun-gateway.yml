name: SENTINEL Cloud Run gateway

on:
  push:
    paths:
      - 'projects/sentinel-cloudrun-gateway/**'
      - '.github/workflows/sentinel-cloudrun-gateway.yml'
  pull_request:
    paths:
      - 'projects/sentinel-cloudrun-gateway/**'
      - '.github/workflows/sentinel-cloudrun-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/sentinel-cloudrun-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/sentinel-cloudrun-gateway/web/package-lock.json
      - name: Validate scenario inventory
        run: python tools/validate_scenarios.py
      - name: Install gateway dependencies
        run: python -m pip install -r requirements-gateway.txt
      - name: Verify signed OIDC and IAP authentication
        run: |
          PYTHONPATH=. python tests/test_oidc_auth.py
          PYTHONPATH=. python tests/test_iap_auth.py
          PYTHONPATH=. python tests/test_iap_middleware.py
      - name: Build and audit explorer dependencies
        working-directory: projects/sentinel-cloudrun-gateway/web
        run: npm ci && npm run build && npm audit
      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit -r requirements-gateway.txt && pip-audit -r requirements-client.txt
      - name: Scan project for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --config /repo/.gitleaks.toml --source /repo --no-git --redact
      - name: Run clean end-to-end suite and local load test
        run: make test-isolated
      - name: Validate cloud configuration without applying resources
        run: sh infra/validate.sh
      - name: Preserve cloud validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-cloud-configuration-validation
          path: projects/sentinel-cloudrun-gateway/infra/evidence/
          if-no-files-found: warn
          retention-days: 14
