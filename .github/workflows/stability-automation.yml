name: Stability Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1-5"
  push:
    branches: [main]
  # Required checks must also run on documentation-only pull requests.
  pull_request:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: Sentinel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Sentinel/pyproject.toml
      - name: Install Sentinel and automation tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83" wheel
          python -m pip install -e ".[dev]" pip-audit
      - name: Run benefit-gated stability automation
        run: |
          sentinel-automation \
            --catalog automation/stability_tasks.json \
            --execute \
            --json-out reports/automation/stability.json \
            --markdown-out reports/automation/stability.md \
            --min-benefit-score 0.85
      - name: Upload stability automation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-stability-automation
          path: |
            Sentinel/reports/automation/
