name: Apply verified OTLP feature payload

on:
  push:
    branches: [feat/otel-trace-import]
    paths:
      - .github/workflows/bootstrap-otel.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/otel-trace-import
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and apply payload
        run: python .github/apply_otel_payload.py
      - name: Commit feature source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: normalize OpenTelemetry traces into evaluation runs"
          git push origin HEAD:feat/otel-trace-import
