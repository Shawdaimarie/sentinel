name: Package installation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel with isolated build dependencies
        run: python -m pip wheel --no-deps --wheel-dir dist ./Sentinel
      - name: Install wheel in a fresh environment
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install dist/sentinel-*.whl
          .package-venv/bin/python -m pip check
      - name: Verify installed commands outside the checkout
        run: .package-venv/bin/python Sentinel/scripts/check_install.py --fixtures Sentinel/examples/otel
