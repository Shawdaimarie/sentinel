name: Aegis CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  aegis-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aegis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9"
          cache-dependency-path: Aegis/go.mod
      - name: Format check
        run: |
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Policy benchmark smoke
        run: go test -run '^$' -bench=. -benchtime=100x ./...
      - name: Policy evaluation harness
        run: go run ./cmd/aegis-policy-eval --policy examples/policy.json --cases examples/policy_eval_cases.json
      - name: Static build
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" -o bin/aegis ./cmd/aegis
          go version -m bin/aegis
      - name: Upload Aegis binary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-binary-evidence
          path: |
            Aegis/bin/aegis
          if-no-files-found: warn

  aegis-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build non-root Aegis image
        run: docker build --progress=plain -t aegis-authorizer:ci Aegis
      - name: Inspect configured user
        run: |
          test "$(docker image inspect aegis-authorizer:ci --format '{{.Config.User}}')" = "65532:65532"
      - name: Start packaged service and reject missing credentials
        run: timeout 60s bash scripts/smoke-image.sh aegis-authorizer aegis-authorizer:ci
      - name: Reject the previous image layout without a writable data directory
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path("Aegis/Dockerfile").read_text()
          line = "COPY --from=build --chown=65532:65532 /out/data /data\n"
          assert text.count(line) == 1
          Path(os.environ["RUNNER_TEMP"], "Dockerfile.no-data").write_text(text.replace(line, ""))
          PY
          docker build --progress=plain -f "$RUNNER_TEMP/Dockerfile.no-data" -t aegis-authorizer:no-data Aegis
          if timeout 60s bash scripts/smoke-image.sh aegis-authorizer aegis-authorizer:no-data > "$RUNNER_TEMP/aegis-no-data.log" 2>&1; then
            cat "$RUNNER_TEMP/aegis-no-data.log"
            echo "The smoke check accepted an image without writable audit storage" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/aegis-no-data.log"
          grep -F 'audit_unavailable' "$RUNNER_TEMP/aegis-no-data.log"
