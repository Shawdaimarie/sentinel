name: Container Security Preflight

# Pull-request images are scanned locally without registry or signing access.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sentinel-eval
            context: Sentinel
            dockerfile: Sentinel/Dockerfile
          - name: aegis-authorizer
            context: Aegis
            dockerfile: Aegis/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.name }}:preflight
          provenance: false
          sbom: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.name }}:preflight
          format: spdx-json
          output-file: ${{ matrix.name }}.spdx.json
          upload-artifact: false

      - name: Vulnerability gate
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: ${{ matrix.name }}.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: ${{ matrix.name }}.vulnerabilities.json

      - name: Summarize vulnerability findings
        if: always()
        run: python3 scripts/summarize-vulnerabilities.py "${{ matrix.name }}.vulnerabilities.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preflight-${{ matrix.name }}
          path: |
            ${{ matrix.name }}.vulnerabilities.json
            ${{ matrix.name }}.spdx.json
          if-no-files-found: warn
